name: validate
# Obot indexes every SKILL.md in this repo and lists invalid ones org-wide, so nothing invalid may merge.
on:
  pull_request:
  push:
    branches: [main]
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest openpyxl
      - name: Validate skills, agents, licences, secrets, catalog
        run: python scripts/validate.py --check-catalog
      - name: Client-skill tests (Linnworks to QuickBooks mapping)
        run: python -m pytest skills/accounting/platforms/linnworks/lw-qbo-mapping/tests -q
